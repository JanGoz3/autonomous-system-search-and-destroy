behaviors:
  CarDriver:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024        # Larger batches smooth out the gradients
      buffer_size: 10240      # Collect a massive amount of data before learning
      learning_rate: 0.0003
      beta: 0.005             # Slightly lower entropy (encourages decisive driving over random twitching)
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3            # 3 epochs is standard for stable PPO
      learning_rate_schedule: linear
    network_settings:
      normalize: true         # CRITICAL: Balances YOLO data vs Distance data
      hidden_units: 256       # Bigger brain
      num_layers: 3           # Deeper logic
    max_steps: 1000000        # 500k is too short for driving. Let it run up to 1M.
    time_horizon: 128         # Look further ahead in the future to connect steering to rewards
    summary_freq: 20000